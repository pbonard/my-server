# holidayfriend: layered on values.yaml, so auth and the chat services follow the image tags of the mobile deployment
# its web app deploys from its own repo (holidayfriend-web)
namespace: holidayfriend
hostname: "holidayfriend.pbonard.com"

# public key of the holidayfriend access tokens, never the one of the mobile app, so neither app trusts the other's tokens
jwks: |
  {
    "keys": [
      {
        "alg": "RS256",
        "kty": "RSA",
        "use": "sig",
        "kid": "holidayfriend-at-key-v1",
        "n": "05Sw8YQd0S8S4SI57TgRhGpT8qcUrMuekdMlJzSFhrqiWsEvr0f2XgAitfD3xmN2KvUH_jeQOF52RAyitAf1TYtfgaMiN3rkt0TR-vVbpAjs_nzg95F3Ba31N0mxhKxbDyeII62xN-eUu1Vm5h-qTriCHSOZD8zYFq3IRlmZBQvhBYEDNGAd8KT-miScigOAImNPLVq72ucw8VBgQCe8KcREcr5Qcjw-FKgT-x8dt7PwHp0FdOxqcOsCTVYlDlydxf2FVcUTHjxhk-xQMwbm12wpflt4f6-EzesWqrPx0990iewBjMLU70r0Yd6A-fMrVjP9_vWaFsFpyDK8BI2ezQ",
        "e": "AQAB"
      }
    ]
  }
flink: null

apps:
  # no phone login on the web, so no twilio secret here
  auth:
    twilio: false
    # the key that seals the secrets of authenticators
    totp: true
  # no calls on the web, and no turn secret in this namespace
  chat:
    turnSecret: false
    # holidayfriend-server asks chat's InviteService whether an invite goes through
    grpcService: true
  # holidayfriend keeps its chats for good, they start from an accepted invite and aren't throwaway
  messagepersist:
    env:
      MESSAGE_TTL: "0"
  # chat, messagepreprocess, messagepersist and messagerelay as in values.yaml: a chat stack of holidayfriend's own, on
  # its keyspace (PROFILE) and its own topics, "holidayfriend.chat-message" and "holidayfriend.prepared-message".
  # no notification: the web app sends noPush, so messagerelay never hands a message on to be pushed
  expo-notification: null
  fcmnotification: null
  notification: null
  signalrelay: null
  search: null
  turn: null
