# holidayfriend: layered on values.yaml, so auth follows the image tag of the mobile deployment
# its web app deploys from its own repo (holidayfriend-web)
namespace: holidayfriend
hostname: "holidayfriend.pbonard.com"
app: "holidayfriend"

# public key of the holidayfriend access tokens, never the one of the mobile app, so neither app trusts the other's tokens
jwks: |
  {
    "keys": [
      {
        "alg": "RS256",
        "kty": "RSA",
        "use": "sig",
        "kid": "holidayfriend-at-key-v1",
        "n": "05Sw8YQd0S8S4SI57TgRhGpT8qcUrMuekdMlJzSFhrqiWsEvr0f2XgAitfD3xmN2KvUH_jeQOF52RAyitAf1TYtfgaMiN3rkt0TR-vVbpAjs_nzg95F3Ba31N0mxhKxbDyeII62xN-eUu1Vm5h-qTriCHSOZD8zYFq3IRlmZBQvhBYEDNGAd8KT-miScigOAImNPLVq72ucw8VBgQCe8KcREcr5Qcjw-FKgT-x8dt7PwHp0FdOxqcOsCTVYlDlydxf2FVcUTHjxhk-xQMwbm12wpflt4f6-EzesWqrPx0990iewBjMLU70r0Yd6A-fMrVjP9_vWaFsFpyDK8BI2ezQ",
        "e": "AQAB"
      }
    ]
  }
flink: null

apps:
  # no phone login on the web, so no twilio secret here
  auth:
    twilio: false
    # the key that seals the secrets of authenticators
    totp: true
  # chat of the mobile release serves this host too: no second chat stack. its route here sets X-App: holidayfriend, so
  # chat, messagepreprocess and messagepersist use the holidayfriend keyspace (APPS in the backend config map).
  # the mobile release allows this route with allowRoutesFrom
  chat:
    deployment: false
    backendNamespace: backend
  expo-notification: null
  fcmnotification: null
  messagepersist: null
  messagepreprocess: null
  messagerelay: null
  notification: null
  signalrelay: null
  search: null
  turn: null
