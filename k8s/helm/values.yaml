# Flink jobs run by the flink operator in the flink namespace (namespace, operator and ghcr secret come from bootstrap)
flink:
  namespace: flink
  version: v2_2
  # the flink image tag, picks the matching s3 plugin jar in /opt/flink/opt
  imageVersion: 2.2.1
  # garage bucket of checkpoints, savepoints and ha metadata (my-infra garage.yaml)
  stateBucket: flink-state
  # shared by every job, a job's own flinkConfiguration overrides these keys
  flinkConfiguration:
    taskmanager.numberOfTaskSlots: "2"
    taskmanager.memory.jvm-metaspace.size: "160m"
    taskmanager.memory.jvm-overhead.min: "64m"
    taskmanager.memory.framework.heap.size: "64m"
    taskmanager.memory.framework.off-heap.size: "64m"
    taskmanager.memory.network.min: "32m"
    taskmanager.memory.network.max: "32m"
    jobmanager.memory.jvm-overhead.min: "64m"
    jobmanager.memory.off-heap.size: "64m"
    # garage, in cluster and path style. the region key can't be s3.endpoint.region, flink 2 refuses
    # overlapping keys (s3.endpoint -> s3.endpoint.region), the hadoop plugin also reads fs.s3a.*
    s3.endpoint: "http://garage.garage.svc.cluster.local:3900"
    s3.path.style.access: "true"
    fs.s3a.endpoint.region: "garage"
    # a jobmanager restart or an upgrade finds the latest checkpoint through configmaps (role flink)
    high-availability.type: kubernetes
    # a cancelled job's last checkpoint stays in garage, it can be restored by hand
    execution.checkpointing.externalized-checkpoint-retention: RETAIN_ON_CANCELLATION
  jobManager:
    # 400m left only the 64m jvm-overhead minimum for native memory, the pods got OOMKilled every ~8 minutes
    memory: "640m"
    cpu: 0.5
  taskManager:
    memory: "640m"
    cpu: 0.5
  # env of every job (the config-map in the flink namespace)
  config:
    KAFKA_BOOTSTRAP_SERVERS: "kafka-cluster-kafka-bootstrap.kafka-system.svc.cluster.local:9093"
    KAFKA_USER_CERT_PATH: "/cert/kafka/user/user.crt"
    KAFKA_USER_KEY_PATH: "/cert/kafka/user/user.key"
    KAFKA_CA_CERT_PATH: "/cert/kafka/cluster/ca.crt"
    VITESS_VTGATE_HOST: "vitess-cluster-vtgate-6e607aba.vitess.svc.cluster.local"
    VITESS_VTGATE_GRPC_PORT: "15999"
  jobs:
    # vitess changes to kafka: the conversation tables to conversation-cdc for search, and the outboxes of conversation
    # and holidayfriend to their chat-message and scheduled-notification. its sources start at the current vitess
    # position when it has no checkpoint. adding or removing a table changes the ids of its operators, so their state
    # can't be restored and the job fails to start: such a change needs a clean start (delete the job and its state)
    cdc-job:
      image: flink/cdcjob:156fcb0
      jar: cdcjob.jar
      entryClass: cdcjob.CdcJob
      parallelism: 1
      flinkConfiguration:
        # no keyed state (source offsets are operator state), so no rocksdb and no managed memory
        state.backend.type: hashmap
        execution.checkpointing.interval: "10s"
        taskmanager.memory.managed.fraction: "0.0"
        # sql planning runs in the jobmanager, it needs more metaspace and heap than the datastream jobs
        jobmanager.memory.jvm-metaspace.size: "160m"
      jobManager:
        memory: "1024m"
    scheduled-notification-job:
      image: flink/schedulednotificationjob:156fcb0
      jar: schedulednotificationjob.jar
      entryClass: schedulednotificationjob.ScheduledNotificationJob
      parallelism: 2
      flinkConfiguration:
        state.backend.type: rocksdb
        execution.checkpointing.incremental: "true"
        taskmanager.memory.managed.size: "64m"
        jobmanager.memory.jvm-metaspace.size: "128m"
    exponential-backoff-retry-job:
      image: flink/exponentialbackoffretryjob:156fcb0
      jar: exponentialbackoffretryjob.jar
      entryClass: exponentialbackoffretryjob.ExponentialBackoffRetryJob
      parallelism: 2
      flinkConfiguration:
        state.backend.type: rocksdb
        execution.checkpointing.incremental: "true"
        taskmanager.memory.managed.size: "64m"
        jobmanager.memory.jvm-metaspace.size: "128m"