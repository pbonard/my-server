
{{- if .Values.jwks }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: public-key-at
  namespace: {{ .Values.namespace }}
data:
  jwks: |
{{ .Values.jwks | indent 4 }}
{{- end }}

---

{{- range $name, $app := .Values.apps }}
---
{{if $app.routePath}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $name }}-route
  namespace: {{ $.Values.namespace }}
  labels:
    app: {{ $name }}
spec:
  parentRefs:
    - name: cluster-gateway
      namespace: envoy-gateway-system
  hostnames:
    - {{ $.Values.hostname | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: {{ $app.routePath }}
      # which app the request is for, from the hostname it came in on. set and not added, so a client's own X-App
      # is replaced: a service can trust it to pick the app's data, like the auth topic of a report
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: X-App
                value: {{ $.Values.app | quote }}
      backendRefs:
        - name: {{ $name }}
          {{- if $app.backendNamespace }}
          # an app of another release: its namespace allows this route with a ReferenceGrant (allowRoutesFrom)
          namespace: {{ $app.backendNamespace }}
          {{- end }}
          port: 80
{{- end}}

---

{{- if not $app.authentication }}
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: {{ $name }}-jwt-auth
  namespace: {{ $.Values.namespace }}
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: {{ $name }}-route
  jwt:
    providers:
      - name: jwt-provider
        extractFrom:
          headers:
            # every request but a browser WebSocket
            - name: Authorization
              valuePrefix: "Bearer "
            # a browser can't set headers on a WebSocket: new WebSocket(url, ["bearer", token]) sends
            # "Sec-WebSocket-Protocol: bearer, <token>", and chat answers with "bearer" alone
            - name: Sec-WebSocket-Protocol
              valuePrefix: "bearer, "
        claimToHeaders:
          - claim: sub
            header: X-User-Id
        localJWKS:
          type: ValueRef
          valueRef:
            group: ""
            kind: ConfigMap
            name: public-key-at
{{- end }}

---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: {{ $name }}-circuit-breaker
  namespace: {{ $.Values.namespace }}
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: {{ $name }}-route
  circuitBreaker:
    maxConnections: {{ $.Values.circuitBreaker.maxConnections }}
    maxPendingRequests: {{$.Values.circuitBreaker.maxPendingRequests}}
    maxParallelRequests: {{$.Values.circuitBreaker.maxParallelRequests}}
{{/*  rateLimit:*/}}
{{/*    type: Global*/}}
{{/*    global:*/}}
{{/*      rules:*/}}
{{/*        - clientSelectors:*/}}
{{/*            - headers:*/}}
{{/*                - type: Distinct*/}}
{{/*                  name: X-User-Id*/}}
{{/*          limit:*/}}
{{/*            requests: 10*/}}
{{/*            unit: Second*/}}
{{- end}}